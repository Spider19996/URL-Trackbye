<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>linkbroom</title>
  <style>
    :root { color-scheme: light dark; }
    body { font: 14px/1.4 system-ui, sans-serif; margin: 0; padding: 12px 14px; width: 270px; }
    h1 { font-size: 15px; margin: 0 0 8px; }
    label { display: flex; align-items: center; gap: 8px; margin: 6px 0; }
    button { width: 100%; padding: 6px; margin-top: 8px; cursor: pointer; }
    #msg, #status { font-size: 12px; opacity: .75; margin-top: 8px; }
  </style>
</head>
<body>
  <h1>linkbroom</h1>
  <label><input type="checkbox" id="enabled"> <span data-i18n="enabled">Clean links automatically</span></label>
  <label><input type="checkbox" id="site"> <span><span data-i18n="site">Not on this site</span> <b id="host"></b></span></label>
  <button id="copy" data-i18n="copy">Copy clean address of this tab</button>
  <div id="msg"></div>
  <div id="status"></div>
  <script src="popup.js" type="module"></script>
</body>
</html>
