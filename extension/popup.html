<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>URL Trackbye</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <img src="icons/icon128.png" alt="" class="logo" id="logo">
    <div class="titles">
      <h1>URL Trackbye</h1>
      <p id="subtitle"></p>
    </div>
    <button class="icon-btn" id="openSettings" hidden>
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </button>
  </header>

  <nav role="tablist">
    <button class="tab active" data-tab="prefs" role="tab" id="tabPrefs"></button>
    <button class="tab" data-tab="page" role="tab" id="tabPage"></button>
    <button class="tab" data-tab="stats" role="tab" id="tabStats"></button>
  </nav>

  <main>
    <section id="prefs" class="panel">
      <div class="card" id="statusCard">
        <div class="badge" id="statusBadge" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/></svg>
        </div>
        <div class="grow">
          <strong id="statusTitle"></strong>
          <div class="muted" id="statusSub"></div>
        </div>
        <button class="btn" id="sync"></button>
      </div>

      <div id="perm" class="notice" hidden>
        <div id="permText"></div>
        <button class="btn primary" id="grant"></button>
      </div>

      <label class="row">
        <span id="lblEnabled"></span>
        <input type="checkbox" id="enabled" class="switch">
      </label>
      <label class="row">
        <span><span id="lblSite"></span> <b id="host"></b></span>
        <input type="checkbox" id="site" class="switch">
      </label>
    </section>

    <section id="page" class="panel" hidden>
      <div class="field">
        <div class="muted" id="lblAddress"></div>
        <div class="url" id="currentUrl"></div>
      </div>
      <div class="field">
        <div class="muted" id="lblClean"></div>
        <div class="url clean" id="cleanUrl"></div>
      </div>
      <button class="btn primary wide" id="copy"></button>
      <div class="muted center" id="msg" aria-live="polite"></div>
    </section>

    <section id="stats" class="panel" hidden>
      <div class="numbers">
        <div class="number"><b id="nToday">–</b><span id="lblToday"></span></div>
        <div class="number"><b id="nTotal">–</b><span id="lblTotal"></span></div>
      </div>
      <div class="muted" id="lblRecent"></div>
      <ul id="recent" class="recent"></ul>
      <div class="muted" id="noStats" hidden></div>
    </section>
  </main>

  <footer>
    <span class="dot" id="dot"></span><span id="progState"></span>
    <span class="grow"></span>
    <span class="muted" id="version"></span>
  </footer>
  <script src="popup.js" type="module"></script>
</body>
</html>
